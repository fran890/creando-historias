<svg width="960" height="240" viewBox="0 0 960 240" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Creando-Historias logo</title>
  <desc id="desc">Minimal modern logo for Creando-Historias with a C-H monogram and wordmark.</desc>
  <defs>
    <linearGradient id="brandGradient" x1="36" y1="30" x2="210" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E91E63"/>
      <stop offset="1" stop-color="#9C27B0"/>
    </linearGradient>
    <linearGradient id="wordGradient" x1="300" y1="58" x2="752" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="0.52" stop-color="#111827"/>
      <stop offset="0.53" stop-color="#E91E63"/>
      <stop offset="1" stop-color="#9C27B0"/>
    </linearGradient>
    <filter id="softShadow" x="12" y="12" width="216" height="216" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#9C27B0" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="36" y="36" width="168" height="168" rx="38" fill="url(#brandGradient)"/>
    <path d="M116 82C94.46 82 78 98.46 78 120C78 141.54 94.46 158 116 158" stroke="white" stroke-width="18" stroke-linecap="round"/>
    <path d="M139 82V158" stroke="white" stroke-width="18" stroke-linecap="round"/>
    <path d="M178 82V158" stroke="white" stroke-width="18" stroke-linecap="round"/>
    <path d="M139 120H178" stroke="white" stroke-width="18" stroke-linecap="round"/>
    <path d="M116 120H139" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.92"/>
  </g>

  <g>
    <text x="260" y="118" fill="url(#wordGradient)" font-family="Outfit, Inter, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="0">
      Creando-Historias
    </text>
    <rect x="265" y="143" width="90" height="7" rx="3.5" fill="#E91E63"/>
    <rect x="365" y="143" width="52" height="7" rx="3.5" fill="#9C27B0" opacity="0.38"/>
    <text x="260" y="180" fill="#6B7280" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="600" letter-spacing="4">
      PLATAFORMA EDITORIAL
    </text>
  </g>
